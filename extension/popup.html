<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="">
    <h1 data-i18n="popup_title">skimcast</h1>
    <button id="langBtn" class="theme-btn" title="Language"></button>
    <button id="themeBtn" class="theme-btn" title="Theme"></button>
  </header>

  <label data-i18n="url_label" for="url">Link</label>
  <input id="url" type="text" data-i18n-placeholder="url_placeholder">

  <button id="go" data-i18n="fetch_btn">Get transcript</button>

  <p id="status" class="status" hidden></p>
  <p id="error" class="error" hidden></p>

  <button id="manualToggle" class="link-btn" data-i18n="manual_add_toggle">Add transcript manually</button>
  <div id="manualForm" hidden>
    <label data-i18n="manual_title_label" for="manualTitle">Title</label>
    <input id="manualTitle" type="text" data-i18n-placeholder="manual_title_placeholder">
    <label data-i18n="manual_text_label" for="manualText">Text</label>
    <textarea id="manualText" rows="6" data-i18n-placeholder="manual_text_placeholder"></textarea>
    <button id="manualSave" data-i18n="manual_save_btn">Save</button>
    <p id="manualError" class="error" hidden></p>
  </div>

  <a id="libraryLink" class="library-link" href="library.html" target="_blank" data-i18n="library_btn">Library</a>

  <script src="lang.js"></script>
  <script src="theme.js"></script>
  <script src="popup.js"></script>
</body>
</html>
