<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="">
    <h1 data-i18n="popup_title">skimcast</h1>
    <button id="langBtn" class="theme-btn" title="Language"></button>
    <button id="themeBtn" class="theme-btn" title="Theme"></button>
  </header>

  <label data-i18n="url_label" for="url">Link</label>
  <input id="url" type="text" data-i18n-placeholder="url_placeholder">

  <button id="go" data-i18n="fetch_btn">Get transcript</button>

  <p id="status" class="status" hidden></p>
  <p id="error" class="error" hidden></p>

  <a id="libraryLink" class="library-link" href="library.html" target="_blank" data-i18n="library_btn">Library</a>

  <script src="lang.js"></script>
  <script src="theme.js"></script>
  <script src="popup.js"></script>
</body>
</html>
